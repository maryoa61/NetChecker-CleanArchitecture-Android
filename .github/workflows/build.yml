name: Android CI Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make Gradlew Executable
      run: chmod +x android/gradlew

    - name: Build and Assemble APKs (Debug and Release)
      working-directory: android
      run: ./gradlew assembleDebug assembleRelease

    - name: List Build Outputs (Diagnostics)
      run: |
        echo "=== Listing all files in android/app/build/outputs ==="
        find android/app/build/outputs -type f || echo "No files/directory found"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChecker-APKs
        path: android/app/build/outputs/apk/**/*.apk
