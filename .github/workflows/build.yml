name: Android CI Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make Gradlew Executable
      # Since the root workspace hosts the full-stack setup, chmod the gradlew executable inside the android subdirectory
      run: chmod +x android/gradlew

    - name: Clean and Build APKs (Debug and Release)
      working-directory: android
      run: ./gradlew clean assembleDebug assembleRelease

    - name: List Build Outputs (Diagnostics)
      if: always()
      run: |
        echo "=== Listing all files in android/app/build ==="
        find android/app/build -type f 2>/dev/null || echo "No files found in build/"
        echo "=== Listing all files under android/app/build/outputs ==="
        find android/app/build/outputs -type f 2>/dev/null || echo "No files found in outputs/"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChecker-APKs
        path: android/app/build/outputs/apk/**/*.apk

