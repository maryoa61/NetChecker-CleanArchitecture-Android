name: Android Production Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build
      run: |
        # پیدا کردنِ پوشه‌ای که فایل gradlew توش قرار داره
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        
        echo "Found gradlew at: $GRADLEW_PATH"
        
        # رفتن به همون پوشه
        cd "$GRADLEW_DIR"
        
        # دادن دسترسی و اجرا
        chmod +x gradlew
        ./gradlew assembleRelease
        
        # ذخیره کردن مسیرِ خروجی برای مرحله بعد
        echo "BUILD_DIR=$GRADLEW_DIR" >> $GITHUB_ENV

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NetChecker-Release-APK
        path: "**/app/build/outputs/apk/release/*.apk"
