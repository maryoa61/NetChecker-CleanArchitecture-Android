name: Android Production Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Project
      # تمام دستورات در یک خط اجرا می‌شوند تا context پوشه حفظ شود
      run: |
        ls -R  # این دستور را اضافه کردیم تا لیست دقیق پوشه‌ها را در لاگ ببینیم و مطمئن شویم gradlew کجاست
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NetChecker-Release-APK
        path: android/app/build/outputs/apk/release/*.apk
